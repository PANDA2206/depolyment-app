[project]
name = "fashionflow"
version = "0.1.0"
description = "Fashion e-commerce reference backend with LangGraph recommendations"
authors = [{ name = "FashionFlow Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.1.0",
    "langchain>=0.3.6",
    "langgraph>=0.2.34",
    "langchain-community>=0.3.6",
    "langchain-openai>=0.2.2",
    "chromadb>=0.5.5",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dateutil>=2.9.0",
    "orjson>=3.10.0",
    "rich>=13.9.0",
    "tenacity>=8.5.0",
    "sentence-transformers>=3.0.0",
    "huggingface-hub>=0.23.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "bandit>=1.7.9"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
strict = true
plugins = []

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
