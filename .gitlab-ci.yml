stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: registry.gitlab.com/$CI_PROJECT_PATH/fashionflow-api

lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt
    - pip install -e backend[dev]
    - test -n "$HUGGINGFACE_API_TOKEN" || (echo "HUGGINGFACE_API_TOKEN not set" && exit 1)
  script:
    - cd backend && ruff check app tests

unit_tests:
  stage: test
  image: python:3.11-slim
  dependencies:
    - lint
  before_script:
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt
    - pip install -e backend[dev]
    - test -n "$HUGGINGFACE_API_TOKEN" || (echo "HUGGINGFACE_API_TOKEN not set" && exit 1)
  script:
    - cd backend && pytest

build:
  stage: build
  image: docker:24.0.2
  services:
    - docker:24.0.2-dind
  script:
    - docker build -f docker/Dockerfile -t $IMAGE_NAME:$CI_COMMIT_SHA .
    - docker push $IMAGE_NAME:$CI_COMMIT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "prod"

deploy_canary:
  stage: deploy
  image: bitnami/kubectl:1.30
  script:
    - kubectl config use-context "$KUBE_CONTEXT"
    - kubectl set image deployment/fashionflow-api api=$IMAGE_NAME:$CI_COMMIT_SHA -n fashionflow
  environment:
    name: review/$CI_COMMIT_SHORT_SHA
    url: https://$CI_ENVIRONMENT_SLUG.fashionflow.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "test"

deploy_prod:
  stage: deploy
  image: bitnami/kubectl:1.30
  script:
    - kubectl config use-context "$KUBE_CONTEXT"
    - kubectl rollout status deployment/fashionflow-api -n fashionflow
  environment:
    name: production
    url: https://api.fashionflow.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual
