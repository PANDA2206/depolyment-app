apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fashionflow-ingress
  namespace: fashionflow
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  rules:
    - host: api.fashionflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fashionflow-api
                port:
                  number: 80
  tls:
    - hosts:
        - api.fashionflow.example.com
      secretName: fashionflow-tls
