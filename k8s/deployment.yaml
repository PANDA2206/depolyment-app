apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashionflow-api
  namespace: fashionflow
  labels:
    app: fashionflow
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fashionflow
      tier: api
  template:
    metadata:
      labels:
        app: fashionflow
        tier: api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/fashionflow-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: fashionflow-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-credentials
                  key: api_key
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /srv/app/.data
              name: vectorstore
      volumes:
        - name: vectorstore
          emptyDir: {}
